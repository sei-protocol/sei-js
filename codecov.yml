flags:
  precompiles:
    paths:
      - packages/precompiles/**
  registry:
    paths:
      - packages/registry/**
  sei-global-wallet:
    paths:
      - packages/sei-global-wallet/**
  mcp-server:
    paths:
      - packages/mcp-server/**
coverage:
  status:
    project:
      precompiles:
        target: 80%
        flags:
          - precompiles
      registry:
        target: 80%
        flags:
          - registry
      sei-global-wallet:
        target: 80%
        flags:
          - sei-global-wallet
