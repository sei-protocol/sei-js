name: Run & Upload Test Coverage

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: precompiles
            flag: precompiles
          - package: registry
            flag: registry
          - package: sei-global-wallet
            flag: sei-global-wallet
          - package: mcp-server
            flag: mcp-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.package }} tests with coverage
        run: bun test --isolate --coverage --coverage-reporter=lcov --coverage-dir=coverage/${{ matrix.flag }} packages/${{ matrix.package }}/src

      - name: Upload ${{ matrix.package }} coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/${{ matrix.flag }}/lcov.info
          flags: ${{ matrix.flag }}
          name: ${{ matrix.flag }}
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
