name: create-sei Smoke

on:
  pull_request:
    paths:
      - '.changeset/**'
      - '.github/workflows/create-sei-smoke.yml'
      - 'biome.json'
      - 'bun.lock'
      - 'package.json'
      - 'packages/create-sei/**'
      - 'packages/precompiles/**'
      - 'scripts/fix-dts-extensions.ts'
      - 'tsconfig.base.json'
      - 'tsconfig.test.json'
  workflow_dispatch:
    inputs:
      precompiles-source:
        description: Validate a local candidate or the staged npm release
        required: true
        default: registry
        type: choice
        options:
          - registry
          - local

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs['precompiles-source'] || 'local' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generated-apps:
    name: Generated apps (${{ github.event_name == 'pull_request' && 'local' || inputs['precompiles-source'] }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRECOMPILES_SOURCE: ${{ github.event_name == 'pull_request' && 'local' || inputs['precompiles-source'] }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Establish Changesets base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git update-ref refs/heads/main "refs/remotes/origin/$BASE_REF"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Validate generated applications
        run: bun run test:create-sei-release -- --precompiles-source "$PRECOMPILES_SOURCE"
