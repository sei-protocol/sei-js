name: UCI
run-name: UCI / Stale Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read

concurrency:
  # A sweep is cheap and idempotent, but cancelling one part-way leaves the triage
  # half-applied, so queue behind a running sweep instead of superseding it.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stale:
    name: Stale
    # Job-level `permissions` replaces the workflow-level block rather than merging,
    # so `contents: read` has to be repeated here to survive.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # See: https://github.com/sei-protocol/uci/releases/tag/v0.0.15
    uses: sei-protocol/uci/.github/workflows/stale-check.yml@65901242783550521f25a19199a6b10e54550b97
    with:
      days-before-pr-stale: 28
      # Issue triage is not automated here. Without this the UCI defaults apply
      # (stale after 8 days, closed 2 days later), which would let a daily cron
      # close community issues nobody agreed to close. -1 disables issue staling.
      days-before-issue-stale: -1
